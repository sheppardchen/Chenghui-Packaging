<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料订单管理系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @media print {
        body * {
          visibility: hidden;
        }
        #print-area, #print-area * {
          visibility: visible;
        }
        #print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 220mm !important;
          margin: 0 auto;
        }
        @page {
          size: auto;
          margin: 1cm;
        }
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 模拟初始数据 ---
        const INITIAL_INVENTORY = [
          { id: 'M001', name: '不锈钢螺丝 M6', category: '标准件', spec: 'M6*20', stock: 1200, unit: '个', minStock: 200 },
          { id: 'M002', name: '铝合金板材', category: '原材料', spec: '1000*2000*3mm', stock: 45, unit: '张', minStock: 10 },
          { id: 'M003', name: '控制芯片 STM32', category: '电子元器件', spec: 'LQFP-64', stock: 350, unit: '片', minStock: 50 },
          { id: 'M004', name: '橡胶密封圈', category: '密封件', spec: '内径15mm', stock: 80, unit: '个', minStock: 100 },
          { id: 'M005', name: '导线 2.5平米', category: '线缆', spec: '红色 100m/卷', stock: 12, unit: '卷', minStock: 5 }
        ];

        const INITIAL_ORDERS = [
          {
            id: 'ORD-20231024-001',
            type: 'inbound', // inbound: 入库, outbound: 出库
            applicant: '张伟',
            department: '生产一部',
            date: '2023-10-24 10:30',
            status: 'approved', // pending: 待审核, approved: 已批准, rejected: 已驳回
            items: [
              { id: 'M001', name: '不锈钢螺丝 M6', spec: 'M6*20', quantity: 500, unit: '个' },
              { id: 'M003', name: '控制芯片 STM32', spec: 'LQFP-64', quantity: 100, unit: '片' }
            ],
            remark: '补充月度消耗备料'
          },
          {
            id: 'ORD-20231025-002',
            type: 'outbound',
            applicant: '李娜',
            department: '研发部',
            date: '2023-10-25 14:15',
            status: 'pending',
            items: [
              { id: 'M002', name: '铝合金板材', spec: '1000*2000*3mm', quantity: 5, unit: '张' },
              { id: 'M004', name: '橡胶密封圈', spec: '内径15mm', quantity: 20, unit: '个' }
            ],
            remark: '原型机测试领用'
          }
        ];

        function App() {
          const [activeTab, setActiveTab] = useState('inventory'); // inventory, orders, new-order
          const [inventory, setInventory] = useState(INITIAL_INVENTORY);
          const [orders, setOrders] = useState(INITIAL_ORDERS);
          const [searchTerm, setSearchTerm] = useState('');
          const [categoryFilter, setCategoryFilter] = useState('ALL');
          const [selectedPrintOrder, setSelectedPrintOrder] = useState(null);

          // 弹窗状态
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [modalType, setModalType] = useState(''); // 'add-material', 'edit-material'
          const [currentMaterial, setCurrentMaterial] = useState({ id: '', name: '', category: '标准件', spec: '', stock: 0, unit: '个', minStock: 10 });

          // 新建订单状态
          const [newOrderType, setNewOrderType] = useState('outbound');
          const [applicant, setApplicant] = useState('');
          const [department, setDepartment] = useState('');
          const [orderRemark, setOrderRemark] = useState('');
          const [selectedItems, setSelectedItems] = useState([]);

          useEffect(() => {
            // 初始化 lucide 图标
            if (window.lucide) {
              window.lucide.createIcons();
            }
          }, [activeTab, orders, inventory, isModalOpen, selectedPrintOrder]);

          // --- 筛选物料 ---
          const filteredInventory = useMemo(() => {
            return inventory.filter(item => {
              const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                    item.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    item.spec.toLowerCase().includes(searchTerm.toLowerCase());
              const matchesCategory = categoryFilter === 'ALL' || item.category === categoryFilter;
              return matchesSearch && matchesCategory;
            });
          }, [inventory, searchTerm, categoryFilter]);

          // 分类列表
          const categories = useMemo(() => {
            const set = new Set(inventory.map(i => i.category));
            return ['ALL', ...Array.from(set)];
          }, [inventory]);

          // --- 物料增删改手势 ---
          const handleSaveMaterial = (e) => {
            e.preventDefault();
            if (modalType === 'add-material') {
              const newId = `M${String(inventory.length + 1).padStart(3, '0')}`;
              setInventory([...inventory, { ...currentMaterial, id: newId }]);
            } else if (modalType === 'edit-material') {
              setInventory(inventory.map(m => m.id === currentMaterial.id ? currentMaterial : m));
            }
            setIsModalOpen(false);
          };

          const handleDeleteMaterial = (id) => {
            if (confirm('确定要删除该物料吗？')) {
              setInventory(inventory.filter(m => m.id !== id));
            }
          };

          // --- 订单创建逻辑 ---
          const handleAddItemToOrder = (material) => {
            const exists = selectedItems.find(i => i.id === material.id);
            if (exists) {
              setSelectedItems(selectedItems.map(i => i.id === material.id ? { ...i, quantity: i.quantity + 1 } : i));
            } else {
              setSelectedItems([...selectedItems, { ...material, quantity: 1 }]);
            }
          };

          const handleQuantityChange = (id, quantity) => {
            const qty = Math.max(1, parseInt(quantity) || 1);
            setSelectedItems(selectedItems.map(i => i.id === id ? { ...i, quantity: qty } : i));
          };

          const handleRemoveItemFromOrder = (id) => {
            setSelectedItems(selectedItems.filter(i => i.id !== id));
          };

          const handleSubmitOrder = (e) => {
            e.preventDefault();
            if (selectedItems.length === 0) {
              alert('请至少选择一项物料');
              return;
            }
            const newOrder = {
              id: `ORD-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(orders.length + 1).padStart(3, '0')}`,
              type: newOrderType,
              applicant,
              department,
              date: new Date().toLocaleString('zh-CN', { hour12: false }),
              status: 'pending',
              items: selectedItems,
              remark: orderRemark
            };
            setOrders([newOrder, ...orders]);
            // 重置表单
            setApplicant('');
            setDepartment('');
            setOrderRemark('');
            setSelectedItems([]);
            setActiveTab('orders');
          };

          // --- 审核订单 (结合库存变更) ---
          const handleApproveOrder = (orderId) => {
            const targetOrder = orders.find(o => o.id === orderId);
            if (!targetOrder) return;

            // 如果是出库单，检查库存是否足够
            if (targetOrder.type === 'outbound') {
              for (let item of targetOrder.items) {
                const invItem = inventory.find(m => m.id === item.id);
                if (!invItem || invItem.stock < item.quantity) {
                  alert(`物料 [${item.name}] 库存不足！现存: ${invItem ? invItem.stock : 0}, 需求: ${item.quantity}`);
                  return;
                }
              }
            }

            // 更新库存
            const updatedInventory = inventory.map(invItem => {
              const matchedItem = targetOrder.items.find(i => i.id === invItem.id);
              if (matchedItem) {
                const change = targetOrder.type === 'inbound' ? matchedItem.quantity : -matchedItem.quantity;
                return { ...invItem, stock: invItem.stock + change };
              }
              return invItem;
            });

            setInventory(updatedInventory);
            setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'approved' } : o));
          };

          const handleRejectOrder = (orderId) => {
            setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'rejected' } : o));
          };

          // 打印触发
          const handlePrint = (order) => {
            setSelectedPrintOrder(order);
            setTimeout(() => {
              window.print();
            }, 100);
          };

          return (
            <div className="min-h-screen flex flex-col md:flex-row">
              {/* Sidebar Navigator */}
              <aside className="w-full md:w-64 bg-slate-900 text-white flex-shrink-0">
                <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                  <div className="bg-blue-600 p-2 rounded-lg">
                    <i data-lucide="box" className="w-6 h-6 text-white"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-lg leading-tight">物料管理系统</h1>
                    <span className="text-xs text-slate-400">OMS Enterprise</span>
                  </div>
                </div>
                <nav className="p-4 space-y-1">
                  <button 
                    onClick={() => setActiveTab('inventory')}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'inventory' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}
                  >
                    <i data-lucide="layers" className="w-5 h-5"></i>
                    <span>库存物料管理</span>
                  </button>
                  <button 
                    onClick={() => setActiveTab('orders')}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'orders' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}
                  >
                    <i data-lucide="clipboard-list" className="w-5 h-5"></i>
                    <span>订单记录审核</span>
                  </button>
                  <button 
                    onClick={() => setActiveTab('new-order')}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'new-order' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}
                  >
                    <i data-lucide="file-plus" className="w-5 h-5"></i>
                    <span>创建出入库单</span>
                  </button>
                </nav>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                {/* 1. 物料库存管理视图 */}
                {activeTab === 'inventory' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                        <h2 className="text-2xl font-bold text-slate-800">库存物料列表</h2>
                        <p className="text-sm text-slate-500">实时监控库存总量、设定库存警戒线</p>
                      </div>
                      <button 
                        onClick={() => {
                          setCurrentMaterial({ id: '', name: '', category: '标准件', spec: '', stock: 0, unit: '个', minStock: 10 });
                          setModalType('add-material');
                          setIsModalOpen(true);
                        }}
                        className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium shadow-sm transition-all"
                      >
                        <i data-lucide="plus" className="w-4 h-4"></i>
                        <span>新增物料品类</span>
                      </button>
                    </div>

                    {/* Filter & Search */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4 justify-between">
                      <div className="relative flex-1">
                        <i data-lucide="search" className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                          type="text" 
                          placeholder="搜索物料编码、名称或规格..." 
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                          className="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="text-sm text-slate-500 flex-shrink-0">分类:</span>
                        <select 
                          value={categoryFilter} 
                          onChange={(e) => setCategoryFilter(e.target.value)}
                          className="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                        >
                          {categories.map(cat => (
                            <option key={cat} value={cat}>{cat === 'ALL' ? '全部分类' : cat}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    {/* Inventory Table */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                              <th className="p-4">物料编码</th>
                              <th className="p-4">名称</th>
                              <th className="p-4">分类</th>
                              <th className="p-4">规格型号</th>
                              <th className="p-4">库存数量</th>
                              <th className="p-4">预警状态</th>
                              <th className="p-4 text-right">操作</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 text-sm">
                            {filteredInventory.map(item => {
                              const isWarning = item.stock <= item.minStock;
                              return (
                                <tr key={item.id} className="hover:bg-slate-50/80 transition-colors">
                                  <td className="p-4 font-mono text-slate-600">{item.id}</td>
                                  <td className="p-4 font-medium text-slate-800">{item.name}</td>
                                  <td className="p-4">
                                    <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
                                      {item.category}
                                    </span>
                                  </td>
                                  <td className="p-4 text-slate-500">{item.spec}</td>
                                  <td className="p-4 font-semibold text-slate-700">{item.stock} {item.unit}</td>
                                  <td className="p-4">
                                    {isWarning ? (
                                      <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                                        <i data-lucide="alert-triangle" className="w-3 h-3"></i>
                                        <span>库存偏低 (≤{item.minStock})</span>
                                      </span>
                                    ) : (
                                      <span className="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                                        <i data-lucide="check-circle-2" className="w-3 h-3"></i>
                                        <span>正常</span>
                                      </span>
                                    )}
                                  </td>
                                  <td className="p-4 text-right space-x-2">
                                    <button 
                                      onClick={() => {
                                        setCurrentMaterial(item);
                                        setModalType('edit-material');
                                        setIsModalOpen(true);
                                      }}
                                      className="text-blue-600 hover:text-blue-800 p-1 rounded hover:bg-blue-50"
                                    >
                                      <i data-lucide="edit-3" className="w-4 h-4"></i>
                                    </button>
                                    <button 
                                      onClick={() => handleDeleteMaterial(item.id)}
                                      className="text-rose-600 hover:text-rose-800 p-1 rounded hover:bg-rose-50"
                                    >
                                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. 订单管理与审核视图 */}
                {activeTab === 'orders' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-800">单据记录与审核</h2>
                      <p className="text-sm text-slate-500">管理所有入库和出库申请单，审批后将自动同步增减库存</p>
                    </div>

                    <div className="space-y-4">
                      {orders.map(order => (
                        <div key={order.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                          <div className="p-5 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4 bg-slate-50/50">
                            <div className="flex items-center space-x-3">
                              <span className={`px-3 py-1 rounded-md text-xs font-bold ${order.type === 'inbound' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'}`}>
                                {order.type === 'inbound' ? '添加入库单' : '领料出库单'}
                              </span>
                              <span className="font-mono font-bold text-slate-700">{order.id}</span>
                            </div>
                            <div className="flex items-center space-x-4">
                              <span className="text-xs text-slate-400">{order.date}</span>
                              <div>
                                {order.status === 'pending' && <span className="px-2.5 py-1 text-xs rounded-full bg-amber-100 text-amber-800 font-medium">待审核</span>}
                                {order.status === 'approved' && <span className="px-2.5 py-1 text-xs rounded-full bg-emerald-100 text-emerald-800 font-medium">已批准执行</span>}
                                {order.status === 'rejected' && <span className="px-2.5 py-1 text-xs rounded-full bg-rose-100 text-rose-800 font-medium">已驳回</span>}
                              </div>
                            </div>
                          </div>

                          <div className="p-5 space-y-4">
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                              <div>
                                <span className="text-slate-400 text-xs block">申请人</span>
                                <span className="font-medium text-slate-700">{order.applicant}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 text-xs block">所属部门</span>
                                <span className="font-medium text-slate-700">{order.department}</span>
                              </div>
                              <div className="col-span-2">
                                <span className="text-slate-400 text-xs block">申请备注</span>
                                <span className="text-slate-600">{order.remark || '无'}</span>
                              </div>
                            </div>

                            {/* Item list */}
                            <div className="bg-slate-50 rounded-lg p-3 border border-slate-100">
                              <table className="w-full text-xs text-left">
                                <thead>
                                  <tr className="text-slate-400 border-b border-slate-200">
                                    <th className="pb-2">物料名称</th>
                                    <th className="pb-2">规格型号</th>
                                    <th className="pb-2 text-right">变动数量</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200/60">
                                  {order.items.map(item => (
                                    <tr key={item.id}>
                                      <td className="py-2 font-medium text-slate-700">{item.name}</td>
                                      <td className="py-2 text-slate-500">{item.spec}</td>
                                      <td className="py-2 text-right font-semibold text-slate-800">
                                        {order.type === 'inbound' ? '+' : '-'}{item.quantity} {item.unit}
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>

                            <div className="flex justify-end space-x-3 pt-2">
                              {order.type === 'outbound' && order.status === 'approved' && (
                                <button 
                                  onClick={() => handlePrint(order)}
                                  className="flex items-center space-x-1.5 px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50"
                                >
                                  <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                                  <span>打印出库单</span>
                                </button>
                              )}
                              {order.status === 'pending' && (
                                <>
                                  <button 
                                    onClick={() => handleRejectOrder(order.id)}
                                    className="px-3 py-1.5 border border-rose-200 text-rose-600 rounded-lg text-xs font-medium hover:bg-rose-50"
                                  >
                                    驳回申请
                                  </button>
                                  <button 
                                    onClick={() => handleApproveOrder(order.id)}
                                    className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium hover:bg-blue-700 shadow-sm"
                                  >
                                    批准执行
                                  </button>
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 3. 创建出入库单视图 */}
                {activeTab === 'new-order' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-800">创建出入库单</h2>
                      <p className="text-sm text-slate-500">挑选所需物料并提交单据审核</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                      {/* Form Details */}
                      <div className="lg:col-span-2 space-y-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                          <h3 className="font-semibold text-slate-800 border-b pb-3">基本信息</h3>
                          
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-medium text-slate-600 mb-1">单据类型</label>
                              <div className="flex space-x-4 pt-1">
                                <label className="flex items-center space-x-2 text-sm cursor-pointer">
                                  <input 
                                    type="radio" 
                                    name="orderType" 
                                    checked={newOrderType === 'outbound'} 
                                    onChange={() => setNewOrderType('outbound')}
                                    className="text-blue-600"
                                  />
                                  <span>领料出库</span>
                                </label>
                                <label className="flex items-center space-x-2 text-sm cursor-pointer">
                                  <input 
                                    type="radio" 
                                    name="orderType" 
                                    checked={newOrderType === 'inbound'} 
                                    onChange={() => setNewOrderType('inbound')}
                                    className="text-blue-600"
                                  />
                                  <span>补充入库</span>
                                </label>
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-medium text-slate-600 mb-1">申请人</label>
                              <input 
                                type="text" 
                                required
                                value={applicant}
                                onChange={(e) => setApplicant(e.target.value)}
                                placeholder="输入姓名" 
                                className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-medium text-slate-600 mb-1">申请部门</label>
                              <input 
                                type="text" 
                                required
                                value={department}
                                onChange={(e) => setDepartment(e.target.value)}
                                placeholder="如: 研发部、生产部" 
                                className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-medium text-slate-600 mb-1">备注/用途说明</label>
                            <textarea 
                              rows="2"
                              value={orderRemark}
                              onChange={(e) => setOrderRemark(e.target.value)}
                              placeholder="简要填写使用目的或说明..." 
                              className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            ></textarea>
                          </div>
                        </div>

                        {/* Order Items Table */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                          <h3 className="font-semibold text-slate-800 border-b pb-3">已选物料明细</h3>
                          {selectedItems.length === 0 ? (
                            <div className="text-center py-8 text-slate-400 text-sm">
                              请从右侧列表中选择需要{newOrderType === 'inbound' ? '入库' : '出库'}的物料
                            </div>
                          ) : (
                            <table className="w-full text-left text-sm border-collapse">
                              <thead>
                                <tr className="border-b text-xs text-slate-400">
                                  <th className="pb-2">物料名称</th>
                                  <th className="pb-2">规格</th>
                                  <th className="pb-2 w-28">数量</th>
                                  <th className="pb-2 text-right">操作</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {selectedItems.map(item => (
                                  <tr key={item.id}>
                                    <td className="py-2.5 font-medium text-slate-700">{item.name}</td>
                                    <td className="py-2.5 text-slate-500 text-xs">{item.spec}</td>
                                    <td className="py-2.5">
                                      <div className="flex items-center space-x-1">
                                        <input 
                                          type="number" 
                                          min="1"
                                          value={item.quantity}
                                          onChange={(e) => handleQuantityChange(item.id, e.target.value)}
                                          className="w-16 border border-slate-200 rounded px-2 py-1 text-xs text-center focus:outline-none focus:ring-1 focus:ring-blue-500"
                                        />
                                        <span className="text-xs text-slate-400">{item.unit}</span>
                                      </div>
                                    </td>
                                    <td className="py-2.5 text-right">
                                      <button 
                                        onClick={() => handleRemoveItemFromOrder(item.id)}
                                        className="text-rose-500 hover:text-rose-700"
                                      >
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                      </button>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          )}

                          <div className="pt-4 border-t flex justify-end">
                            <button 
                              onClick={handleSubmitOrder}
                              className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium shadow-sm transition-all"
                            >
                              提交申请单
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* Pick Items List */}
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[600px]">
                        <h3 className="font-semibold text-slate-800 pb-3 border-b mb-3">选择库存物料</h3>
                        
                        <div className="relative mb-3">
                          <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                          <input 
                            type="text" 
                            placeholder="搜索快速添加..." 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full pl-9 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500"
                          />
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                          {filteredInventory.map(item => (
                            <div 
                              key={item.id}
                              onClick={() => handleAddItemToOrder(item)}
                              className="p-3 border border-slate-100 hover:border-blue-200 hover:bg-blue-50/50 rounded-lg cursor-pointer transition-all group flex justify-between items-center"
                            >
                              <div>
                                <div className="text-xs font-semibold text-slate-700 group-hover:text-blue-600">{item.name}</div>
                                <div className="text-[11px] text-slate-400">规格: {item.spec}</div>
                                <div className="text-[11px] text-slate-500 mt-1">现存: {item.stock} {item.unit}</div>
                              </div>
                              <div className="bg-slate-100 group-hover:bg-blue-600 group-hover:text-white text-slate-500 rounded-full p-1.5 transition-colors">
                                <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* 弹窗：新增/修改物料 */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-slate-800">
                        {modalType === 'add-material' ? '新增物料品类' : '编辑物料信息'}
                      </h3>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <form onSubmit={handleSaveMaterial} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-600 mb-1">物料名称</label>
                        <input 
                          type="text" 
                          required
                          value={currentMaterial.name}
                          onChange={(e) => setCurrentMaterial({ ...currentMaterial, name: e.target.value })}
                          className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">分类</label>
                          <input 
                            type="text" 
                            required
                            value={currentMaterial.category}
                            onChange={(e) => setCurrentMaterial({ ...currentMaterial, category: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">单位</label>
                          <input 
                            type="text" 
                            required
                            value={currentMaterial.unit}
                            onChange={(e) => setCurrentMaterial({ ...currentMaterial, unit: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-600 mb-1">规格型号</label>
                        <input 
                          type="text" 
                          value={currentMaterial.spec}
                          onChange={(e) => setCurrentMaterial({ ...currentMaterial, spec: e.target.value })}
                          className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">初始/当前库存</label>
                          <input 
                            type="number" 
                            required
                            value={currentMaterial.stock}
                            onChange={(e) => setCurrentMaterial({ ...currentMaterial, stock: parseInt(e.target.value) || 0 })}
                            className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">预警警戒线</label>
                          <input 
                            type="number" 
                            required
                            value={currentMaterial.minStock}
                            onChange={(e) => setCurrentMaterial({ ...currentMaterial, minStock: parseInt(e.target.value) || 0 })}
                            className="w-full border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end space-x-3 pt-3 border-t">
                        <button 
                          type="button" 
                          onClick={() => setIsModalOpen(false)}
                          className="px-4 py-2 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-50"
                        >
                          取消
                        </button>
                        <button 
                          type="submit"
                          className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium shadow-sm"
                        >
                          保存
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* 隐藏的打印专用区域 */}
              {selectedPrintOrder && (
                <div id="print-area" className="hidden print:block p-4 text-black font-sans" style={{ width: '220mm', margin: '0 auto' }}>
                  <div className="text-center border-b-2 border-black pb-4 mb-4">
                    <h1 className="text-2xl font-bold tracking-widest mb-1">物料出库凭单</h1>
                    <p className="text-xs">Outbound Material Requisition Form</p>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs mb-4">
                    <div><span className="font-bold">单据编号：</span>{selectedPrintOrder.id}</div>
                    <div><span className="font-bold">出库日期：</span>{selectedPrintOrder.date}</div>
                    <div><span className="font-bold">领料部门：</span>{selectedPrintOrder.department}</div>
                    <div><span className="font-bold">领 料 人：</span>{selectedPrintOrder.applicant}</div>
                    <div className="col-span-2"><span className="font-bold">领料备注：</span>{selectedPrintOrder.remark || '无'}</div>
                  </div>

                  <table className="w-full text-xs border-collapse border border-black mb-6">
                    <thead>
                      <tr className="bg-gray-100 border-b border-black">
                        <th className="border border-black p-2">序号</th>
                        <th className="border border-black p-2">物料编码</th>
                        <th className="border border-black p-2">物料名称</th>
                        <th className="border border-black p-2">规格型号</th>
                        <th className="border border-black p-2">出库数量</th>
                        <th className="border border-black p-2">单位</th>
                      </tr>
                    </thead>
                    <tbody>
                      {selectedPrintOrder.items.map((item, idx) => (
                        <tr key={item.id} className="text-center">
                          <td className="border border-black p-2">{idx + 1}</td>
                          <td className="border border-black p-2 font-mono">{item.id}</td>
                          <td className="border border-black p-[#4] text-left">{item.name}</td>
                          <td className="border border-black p-2 text-left">{item.spec}</td>
                          <td className="border border-black p-2 font-bold">{item.quantity}</td>
                          <td className="border border-black p-2">{item.unit}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="grid grid-cols-3 gap-4 text-xs pt-4 mt-8">
                    <div>批准人（签字）：_________________</div>
                    <div>发料人（签字）：_________________</div>
                    <div>领料人（签字）：_________________</div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
