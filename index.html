<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物料订单管理系统 - 承辉包装</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media (max-width: 640px) {
            .mobile-touch-target { min-height: 44px; }
            .mobile-order-first { order: -1 !important; }
        }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 1. 登录与找回密码遮罩页面 -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-100 my-auto">
            <div class="text-center mb-6">
                <div class="flex justify-center mb-4">
                    <svg class="h-10 sm:h-12 w-auto" viewBox="0 0 520 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M75 18 C30 18 10 50 10 75 C10 95 30 100 55 95 C72 92 88 78 96 68 L84 57 C77 65 65 77 50 78 C38 79 26 73 26 62 C26 42 45 32 75 32 L85 32 L95 18 Z" fill="url(#logo-grad1)"/>
                        <path d="M72 18 L60 95 L78 95 L84 55 C92 42 112 30 128 30 L135 18 L105 18 C92 18 82 25 76 34 L78 18 Z" fill="url(#logo-grad2)"/>
                        <path d="M125 18 L102 95 L120 95 L143 18 Z" fill="#6B21A8"/>
                        <text x="160" y="65" font-family="'PingFang SC', sans-serif" font-weight="900" font-size="52" fill="#7E22CE">承辉包装</text>
                        <text x="162" y="92" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#1E1B4B" letter-spacing="2">CHENGHUI PACKAGING</text>
                        <defs>
                            <linearGradient id="logo-grad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D946EF"/><stop offset="100%" stop-color="#9333EA"/></linearGradient>
                            <linearGradient id="logo-grad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#6B21A8"/></linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight mt-2" id="auth-title">物料订单管理系统</h2>
            </div>
            
            <form id="login-form" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-sm" autocomplete="off">
                <div>
                    <label class="block font-medium text-slate-700 mb-1" id="label-user-email">登录账号</label>
                    <div class="relative flex items-center border border-slate-300 bg-slate-100 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500">
                        <span class="w-12 flex items-center justify-center text-slate-400 bg-slate-100 shrink-0"><i class="fa-solid fa-user" id="auth-icon"></i></span>
                        <input type="text" id="auth-input-id" value="ChenghuiGroup" readonly class="w-full bg-slate-100 text-slate-600 p-3 sm:p-2.5 outline-none cursor-not-allowed font-medium border-0">
                    </div>
                </div>
                <div id="password-field-wrap">
                    <label class="block font-medium text-slate-700 mb-1">密码</label>
                    <div class="relative flex items-center border border-slate-300 bg-white rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500">
                        <span class="w-12 flex items-center justify-center text-slate-400 bg-slate-50 shrink-0"><i class="fa-solid fa-key"></i></span>
                        <input type="password" id="auth-password" autocomplete="new-password" class="w-full bg-white p-3 sm:p-2.5 outline-none border-0" placeholder="">
                        <button type="button" onclick="togglePasswordVisibility()" class="w-12 flex items-center justify-center text-slate-400 hover:text-slate-600 bg-white shrink-0 focus:outline-none">
                            <i class="fa-solid fa-eye" id="pwd-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div id="remember-me-wrap" class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600">
                        <input type="checkbox" id="remember-me-checkbox" checked class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <span>常登录模式 (保持30天免重复登录)</span>
                    </label>
                </div>
                
                <div id="auth-msg" class="text-xs font-medium hidden p-2.5 rounded-lg border"></div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-3 rounded-xl font-bold transition shadow-md shadow-indigo-200 mobile-touch-target flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> <span>安全登录</span>
                </button>

                <div class="flex justify-between text-xs pt-2 text-slate-500 border-t border-slate-100 mt-4">
                    <button type="button" onclick="switchAuthMode('forgot')" id="toggle-forgot-btn" class="hover:text-indigo-600 underline py-1">忘记密码？通过邮箱重置</button>
                    <button type="button" onclick="switchAuthMode('login')" id="toggle-login-btn" class="hover:text-indigo-600 underline py-1 hidden">返回登录</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 主页面结构 -->
    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="bg-white px-2 py-0.5 sm:px-3 sm:py-1 rounded-lg flex items-center shadow-sm">
                        <svg class="h-5 sm:h-7 w-auto" viewBox="0 0 520 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M75 18 C30 18 10 50 10 75 C10 95 30 100 55 95 C72 92 88 78 96 68 L84 57 C77 65 65 77 50 78 C38 79 26 73 26 62 C26 42 45 32 75 32 L85 32 L95 18 Z" fill="url(#logo-grad1-hdr)"/>
                            <path d="M72 18 L60 95 L78 95 L84 55 C92 42 112 30 128 30 L135 18 L105 18 C92 18 82 25 76 34 L78 18 Z" fill="url(#logo-grad2-hdr)"/>
                            <path d="M125 18 L102 95 L120 95 L143 18 Z" fill="#6B21A8"/>
                            <text x="160" y="65" font-family="'PingFang SC', sans-serif" font-weight="900" font-size="52" fill="#7E22CE">承辉包装</text>
                            <text x="162" y="92" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#1E1B4B" letter-spacing="2">CHENGHUI PACKAGING</text>
                            <defs>
                                <linearGradient id="logo-grad1-hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D946EF"/><stop offset="100%" stop-color="#9333EA"/></linearGradient>
                                <linearGradient id="logo-grad2-hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#6B21A8"/></linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1 class="text-base sm:text-xl font-bold tracking-wide truncate max-w-[140px] sm:max-w-none">订单管理 <span class="text-[10px] sm:text-xs font-normal bg-indigo-600 px-1.5 py-0.5 rounded ml-1 hidden sm:inline">ChenghuiGroup</span></h1>
                </div>
                <div class="flex items-center space-x-1.5 sm:space-x-3">
                    <div id="cloud-status" class="flex items-center space-x-1 text-[11px] sm:text-xs bg-slate-800 px-2 py-1 sm:px-3 sm:py-1.5 rounded-full border border-slate-700">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="text-emerald-400 font-medium hidden sm:inline">云端已连接</span>
                    </div>
                    <button onclick="openChangePwdModal()" class="bg-indigo-600 hover:bg-indigo-500 text-[11px] sm:text-xs px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-key"></i> <span class="hidden sm:inline">修改密码</span>
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-500 text-[11px] sm:text-xs px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">退出</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6 flex-1 w-full">
            <!-- 全局关键词搜索栏 -->
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                <span class="text-slate-400 text-sm pl-2"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="global-search-input" oninput="handleGlobalSearch()" placeholder="全局搜索：输入客户名、订单号、材料名称、供应商或批注关键字..." class="w-full text-xs sm:text-sm outline-none bg-transparent text-slate-700">
                <button type="button" onclick="clearGlobalSearch()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1">清空</button>
            </div>

            <!-- KPI 看板 -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center text-slate-500 text-xs sm:text-sm">
                        <span>月度总订单数</span>
                        <i class="fa-solid fa-cart-shopping text-indigo-500"></i>
                    </div>
                    <div class="text-lg sm:text-2xl font-bold mt-1.5 sm:mt-2" id="kpi-orders">0 笔</div>
                    <div class="text-[10px] sm:text-xs text-slate-400 mt-1 truncate" id="kpi-orders-trend">
                        <span>环比：</span><span class="font-bold text-emerald-600">+0.0%</span>
                    </div>
                </div>
                <div class="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center text-slate-500 text-xs sm:text-sm">
                        <span>月度订单总额</span>
                        <i class="fa-solid fa-sack-dollar text-emerald-500"></i>
                    </div>
                    <div class="text-lg sm:text-2xl font-bold mt-1.5 sm:mt-2 text-emerald-600 truncate" id="kpi-amount">¥0.00</div>
                    <div class="text-[10px] sm:text-xs text-slate-400 mt-1 truncate" id="kpi-amount-trend">
                        <span>环比：</span><span class="font-bold text-emerald-600">+0.0%</span>
                    </div>
                </div>
                <div class="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center text-slate-500 text-xs sm:text-sm">
                        <span>原材料总入库</span>
                        <i class="fa-solid fa-arrow-down-long text-blue-500"></i>
                    </div>
                    <div class="text-lg sm:text-2xl font-bold mt-1.5 sm:mt-2 text-blue-600" id="kpi-in-stock">0 件</div>
                    <div class="text-[10px] sm:text-xs text-slate-400 mt-1 truncate" id="kpi-in-trend"><span>入库总量</span></div>
                </div>
                <div class="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center text-slate-500 text-xs sm:text-sm">
                        <span>原材料总出库</span>
                        <i class="fa-solid fa-arrow-up-long text-rose-500"></i>
                    </div>
                    <div class="text-lg sm:text-2xl font-bold mt-1.5 sm:mt-2 text-rose-600" id="kpi-out-stock">0 件</div>
                    <div class="text-[10px] sm:text-xs text-slate-400 mt-1 truncate" id="kpi-out-trend"><span>出库总量</span></div>
                </div>
            </div>

            <!-- Tab 选项卡导航 -->
            <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-2 sm:px-4 pt-1.5 overflow-x-auto custom-scroll">
                <button onclick="switchTab('orders')" id="tab-btn-orders" class="px-3.5 sm:px-5 py-2.5 sm:py-3 border-b-2 border-indigo-600 font-medium text-xs sm:text-sm text-indigo-600 flex items-center gap-1.5 whitespace-nowrap mobile-order-first"><i class="fa-solid fa-users-viewfinder"></i> 客户订单管理</button>
                <button onclick="switchTab('inventory')" id="tab-btn-inventory" class="px-3.5 sm:px-5 py-2.5 sm:py-3 border-b-2 border-transparent font-medium text-xs sm:text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-boxes-packing"></i> 原材料出入库与库存联动</button>
                <button onclick="switchTab('report')" id="tab-btn-report" class="px-3.5 sm:px-5 py-2.5 sm:py-3 border-b-2 border-transparent font-medium text-xs sm:text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-chart-pie"></i> 月度深度分析与报表</button>
            </div>

            <!-- 1. 客户订单模块 -->
            <section id="sec-orders" class="bg-white p-4 sm:p-6 rounded-b-xl shadow-sm border border-t-0 border-slate-200">
                <div class="flex justify-between items-center mb-4 sm:mb-6">
                    <h2 class="text-base sm:text-lg font-bold text-slate-800">客户订单分类列表</h2>
                    <button type="button" onclick="openOrderModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm mobile-touch-target cursor-pointer z-20"><i class="fa-solid fa-plus"></i> 新增客户订单</button>
                </div>
                <div id="orders-grouped-container" class="space-y-3 sm:space-y-4"></div>
            </section>

            <!-- 2. 原材料出入库模块 -->
            <section id="sec-inventory" class="bg-white p-4 sm:p-6 rounded-b-xl shadow-sm border border-t-0 border-slate-200 hidden space-y-6">
                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-warehouse text-indigo-500"></i> 原材料实时库存结余（独立联动核算）
                    </h3>
                    <div id="material-balance-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
                </div>

                <form id="inventory-batch-form" onsubmit="handleBatchInventorySubmit(event)" class="border-t border-slate-100 pt-4">
                    <h2 class="text-sm sm:text-md font-bold text-slate-800 mb-3">批量录入出入库记录 (含供应商)</h2>
                    <div id="batch-rows-container" class="space-y-3 mb-4"></div>
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <button type="button" onclick="addInventoryRow()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 font-medium mobile-touch-target"><i class="fa-solid fa-plus"></i> 增加一行</button>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm px-4 py-2 rounded-lg font-medium shadow-sm mobile-touch-target"><i class="fa-solid fa-cloud-arrow-up"></i> 提交云端保存</button>
                    </div>
                </form>

                <div class="overflow-x-auto custom-scroll border border-slate-200 rounded-lg pt-2">
                    <table class="w-full text-xs sm:text-sm text-left text-slate-600 min-w-[650px]">
                        <thead class="bg-slate-50 text-slate-700 border-b border-slate-200">
                            <tr>
                                <th class="p-2.5 sm:p-3">日期</th>
                                <th class="p-2.5 sm:p-3">材料名称</th>
                                <th class="p-2.5 sm:p-3">供应商名称</th>
                                <th class="p-2.5 sm:p-3">类型</th>
                                <th class="p-2.5 sm:p-3">数量</th>
                                <th class="p-2.5 sm:p-3">批注说明</th>
                                <th class="p-2.5 sm:p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body"></tbody>
                    </table>
                </div>
            </section>

            <!-- 3. 月度深度分析与报表模块 -->
            <section id="sec-report" class="bg-white p-4 sm:p-6 rounded-b-xl shadow-sm border border-t-0 border-slate-200 hidden space-y-6 sm:space-y-8">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-slate-100 pb-4 gap-3">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800">月度经营与客户分析报告</h2>
                        <p class="text-xs text-slate-500 mt-0.5">多维度核算客户订单占比、采购规模及出入库增减趋势</p>
                    </div>
                    <button onclick="exportReportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center justify-center gap-1.5 shadow-sm mobile-touch-target">
                        <i class="fa-solid fa-file-excel"></i> 导出 Excel 报表
                    </button>
                </div>

                <div class="bg-indigo-50/70 border border-indigo-100 p-3.5 sm:p-4 rounded-xl text-xs space-y-1.5 text-indigo-950">
                    <div class="font-bold text-xs sm:text-sm text-indigo-900 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-line text-indigo-600"></i> 月度经营数据智能分析结论
                    </div>
                    <div id="smart-report-text" class="leading-relaxed">生成中...</div>
                </div>

                <div>
                    <h3 class="text-xs sm:text-sm font-bold text-slate-700 mb-3 sm:mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-group text-indigo-500"></i> 独立客户经营指标分析
                    </h3>
                    <div id="customer-cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
                    <div class="border border-slate-200 p-3.5 sm:p-4 rounded-xl bg-slate-50/50">
                        <h4 class="text-xs font-bold text-slate-700 mb-2.5">各客户订单笔数对比</h4>
                        <div class="h-56 sm:h-64"><canvas id="chart-orders-qty"></canvas></div>
                    </div>
                    <div class="border border-slate-200 p-4 rounded-xl bg-slate-50/50">
                        <h4 class="text-xs font-bold text-slate-700 mb-2.5">各客户消费总金额(元)对比</h4>
                        <div class="h-56 sm:h-64"><canvas id="chart-orders-amount"></canvas></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 弹窗：修改密码 -->
    <div id="modal-changepwd" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-xl max-w-sm w-full">
            <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-3">修改系统密码</h3>
            <form onsubmit="handlePasswordChange(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium mb-1 text-slate-700">输入原密码</label>
                    <input type="password" id="old-pwd" required class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block font-medium mb-1 text-slate-700">输入新密码 (至少8位)</label>
                    <input type="password" id="new-pwd" minlength="8" required class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="不得少于8位">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="document.getElementById('modal-changepwd').classList.add('hidden')" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg mobile-touch-target">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 mobile-touch-target">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 弹窗：新建/编辑客户订单 -->
    <div id="modal-order" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-3 sm:p-4">
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto custom-scroll">
            <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-3" id="order-modal-title">新建客户订单</h3>
            <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="ord-edit-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium mb-1 text-slate-700">订单号 *</label>
                        <input type="text" id="ord-no" required class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-mono" placeholder="自动生成">
                    </div>
                    <div>
                        <label class="block font-medium mb-1 text-slate-700">客户名称 *</label>
                        <input type="text" id="ord-customer" required class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="如：上海捷科技">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">

                        <label class="block font-medium mb-1 text-slate-700">出库数量</label>
                        <input type="number" id="ord-shipped-qty" min="0" value="0" oninput="calcOrderDetails()" class="w-full border border-slate-300 p-2 rounded-lg bg-white">

                    <div>
                        <label class="block font-medium mb-1 text-slate-700">出库时间</label>
                        <input type="date" id="ord-ship-date" class="w-full border border-slate-300 p-2 rounded-lg bg-white">

                    <div>
                        <label class="block font-medium mb-1 text-slate-700">剩余未出库</label>

    <!-- JS 核心逻辑 -->
    <script>
        const SUPABASE_URL = "https://bmihjttxiqlzypdvxrdo.supabase.co";
        const SUPABASE_KEY = "填入您的Publishable key(eyJh...开头)"; 
        
        const FIXED_USER = "ChenghuiGroup";
        const DEFAULT_PWD = "123456";

        let supabaseClient = null;
        let ordersData = [];
        let inventoryData = [];
        let authMode = 'login';
        let chartInstance1 = null;
        let chartInstance2 = null;
        let globalSearchKeyword = '';

        window.addEventListener('DOMContentLoaded', () => {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            checkSession();
        });

        function checkSession() {
            const isSessionLogged = sessionStorage.getItem('chenghui_logged');
            const isPersistentLogged = localStorage.getItem('chenghui_persistent_logged');

            if (isSessionLogged === 'true' || isPersistentLogged === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initInventoryBatchRows();
                fetchDataFromCloud();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('auth-password').value = '';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('auth-password');
            const eyeIcon = document.getElementById('pwd-eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        function switchAuthMode(mode) {
            authMode = mode;
            const title = document.getElementById('auth-title');
            const userLabel = document.getElementById('label-user-email');
            const authInput = document.getElementById('auth-input-id');
            const authIcon = document.getElementById('auth-icon');
            const pwdField = document.getElementById('password-field-wrap');
            const rememberWrap = document.getElementById('remember-me-wrap');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleForgot = document.getElementById('toggle-forgot-btn');
            const toggleLogin = document.getElementById('toggle-login-btn');
            const msg = document.getElementById('auth-msg');

            msg.classList.add('hidden');
            if (mode === 'forgot') {
                title.innerText = "通过邮箱重置密码";
                userLabel.innerText = "电子邮箱";
                authInput.type = "email";
                authInput.readOnly = false;
                authInput.className = "w-full bg-white p-3 sm:p-2.5 outline-none border-0";
                authInput.placeholder = "your_email@domain.com";
                authInput.value = "";
                authIcon.className = "fa-solid fa-envelope";
                pwdField.classList.add('hidden');
                if(rememberWrap) rememberWrap.classList.add('hidden');
                document.getElementById('auth-password').required = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>发送重置密码邮件</span>';
                toggleForgot.classList.add('hidden');
                toggleLogin.classList.remove('hidden');
            } else {
                title.innerText = "物料订单管理系统";
                userLabel.innerText = "登录账号";
                authInput.type = "text";
                authInput.readOnly = true;
                authInput.className = "w-full bg-slate-100 text-slate-600 p-3 sm:p-2.5 outline-none cursor-not-allowed font-medium border-0";
                authInput.placeholder = "ChenghuiGroup";
                authInput.value = FIXED_USER;
                authIcon.className = "fa-solid fa-user";
                pwdField.classList.remove('hidden');
                if(rememberWrap) rememberWrap.classList.remove('hidden');
                document.getElementById('auth-password').required = true;
                document.getElementById('auth-password').value = "";
                submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> <span>安全登录</span>';
                toggleForgot.classList.remove('hidden');
                toggleLogin.classList.add('hidden');
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('auth-msg');
            msg.classList.remove('hidden');

            if (authMode === 'forgot') {
                const email = document.getElementById('auth-input-id').value.trim();
                msg.className = "text-xs font-medium text-blue-600 bg-blue-50 border-blue-200 p-2.5 rounded-lg";
                msg.innerText = "正在发送重置邮件...";
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href,
                });
                if (error) {
                    msg.className = "text-xs font-medium text-rose-600 bg-rose-50 border-rose-200 p-2.5 rounded-lg";
                    msg.innerText = "发送失败: " + error.message;
                } else {
                    msg.className = "text-xs font-medium text-emerald-600 bg-emerald-50 border-emerald-200 p-2.5 rounded-lg";
                    msg.innerText = "重置邮件已发送成功！请登录您的邮箱查收并点击链接修改密码。";
                }
            } else {
                const u = document.getElementById('auth-input-id').value.trim();
                const p = document.getElementById('auth-password').value.trim();
                const currentPwd = localStorage.getItem('app_custom_pwd') || DEFAULT_PWD;

                if (u === FIXED_USER && p === currentPwd) {
                    const rememberMe = document.getElementById('remember-me-checkbox').checked;
                    sessionStorage.setItem('chenghui_logged', 'true');
                    if (rememberMe) {
                        localStorage.setItem('chenghui_persistent_logged', 'true');
                    } else {
                        localStorage.removeItem('chenghui_persistent_logged');
                    }
                    document.getElementById('auth-password').value = "";
                    checkSession();
                } else {
                    msg.className = "text-xs font-medium text-rose-600 bg-rose-50 border-rose-200 p-2.5 rounded-lg";
                    msg.innerText = "密码错误！请重新输入。";
                }
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('chenghui_logged');
            localStorage.removeItem('chenghui_persistent_logged');
            document.getElementById('auth-password').value = "";
            checkSession();
        }

        function openChangePwdModal() {
            document.getElementById('old-pwd').value = '';
            document.getElementById('new-pwd').value = '';
            document.getElementById('modal-changepwd').classList.remove('hidden');
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const oldP = document.getElementById('old-pwd').value;
            const newP = document.getElementById('new-pwd').value;
            const currentPwd = localStorage.getItem('app_custom_pwd') || DEFAULT_PWD;

            if (oldP !== currentPwd) {
                alert("原密码输入错误！");
                return;
            }
            if (newP.length < 8) {
                alert("新密码长度不能少于 8 位！");
                return;
            }

            localStorage.setItem('app_custom_pwd', newP);
            alert("密码修改成功！下次登录请使用新密码。");
            document.getElementById('modal-changepwd').classList.add('hidden');
        }

        async function fetchDataFromCloud() {
            if (!supabaseClient) return;
            let { data: orders, error: ordErr } = await supabaseClient.from('orders').select('*').order('id', { ascending: false });
            if (ordErr) console.error("加载订单错误:", ordErr);
            ordersData = orders || [];

            let { data: inv, error: invErr } = await supabaseClient.from('inventory').select('*').order('id', { ascending: false });
            if (invErr) console.error("加载库存错误:", invErr);
            inventoryData = inv || [];

            renderOrders();
            renderInventoryTable();
            updateKPIs();
        }

        function switchTab(tab) {
            ['orders', 'inventory', 'report'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "px-3.5 sm:px-5 py-2.5 sm:py-3 border-b-2 border-transparent font-medium text-xs sm:text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1.5 whitespace-nowrap";
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "px-3.5 sm:px-5 py-2.5 sm:py-3 border-b-2 border-indigo-600 font-medium text-xs sm:text-sm text-indigo-600 flex items-center gap-1.5 whitespace-nowrap";

            if (tab === 'report') renderDeepReport();
        }

        function handleGlobalSearch() {
            const searchInput = document.getElementById('global-search-input');
            globalSearchKeyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
            renderOrders();
            renderInventoryTable();
        }

        function clearGlobalSearch() {
            const searchInput = document.getElementById('global-search-input');
            if(searchInput) searchInput.value = '';
            globalSearchKeyword = '';
            renderOrders();
            renderInventoryTable();
        }

        function renderOrders() {
            const container = document.getElementById('orders-grouped-container');
            if(!container) return;
            
            const filteredOrders = ordersData.filter(o => {
                if (!globalSearchKeyword) return true;
                const matchStr = `${o.order_no || ''} ${o.customer || ''} ${o.remark || ''}`.toLowerCase();
                return matchStr.includes(globalSearchKeyword);
            });

            container.innerHTML = filteredOrders.length === 0 ? `<div class="text-center py-10 text-slate-400 text-xs sm:text-sm">暂无匹配的订单数据</div>` : '';
            
            const groups = {};
            filteredOrders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); });
            
            Object.keys(groups).forEach((customer, index) => {
                const list = groups[customer];
                const totalAmt = list.reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
                container.innerHTML += `
                    <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                        <div onclick="document.getElementById('acc-${index}').classList.toggle('hidden')" class="bg-slate-50/80 p-3.5 sm:p-4 flex justify-between items-center cursor-pointer hover:bg-slate-100/80 transition">
                            <span class="font-bold text-slate-800 text-xs sm:text-sm">${customer} <span class="font-normal text-slate-500">(${list.length} 笔)</span></span>
                            <span class="text-xs sm:text-sm font-semibold text-emerald-600">累计金额: ¥${totalAmt.toFixed(2)}</span>
                        </div>
                        <div id="acc-${index}" class="border-t border-slate-200 p-2.5 sm:p-3 text-xs overflow-x-auto custom-scroll">
                            <table class="w-full text-left text-slate-600 min-w-[720px]">
                                <tr class="bg-slate-100/60 text-slate-500 font-bold">
                                    <th class="p-2">订单号</th><th class="p-2">下单日期</th><th class="p-2">总数量</th><th class="p-2">出库数量</th><th class="p-2">剩余未出库</th><th class="p-2">出库时间</th><th class="p-2">总额</th><th class="p-2">批注</th><th class="p-2 text-right">操作</th>
                                </tr>
                                ${list.map(o => {
                                    const totalQ = Number(o.quantity || 0);
                                    const shippedQ = Number(o.shipped_quantity || 0);
                                    const remainingQ = Math.max(0, totalQ - shippedQ);
                                    return `
                                        <tr class="border-b border-slate-100">
                                            <td class="p-2 font-mono font-medium text-indigo-600">${o.order_no || '无单号'}</td>
                                            <td class="p-2">${o.order_date || '-'}</td>
                                            <td class="p-2 font-bold">${totalQ}</td>
                                            <td class="p-2 text-blue-600 font-medium">${shippedQ}</td>
                                            <td class="p-2 text-amber-600 font-bold">${remainingQ}</td>
                                            <td class="p-2 text-slate-500">${o.ship_date || '未出库'}</td>
                                            <td class="p-2 text-emerald-600 font-bold">¥${Number(o.total_amount || 0).toFixed(2)}</td>
                                            <td class="p-2 text-slate-500">${o.remark || '无批注'}</td>
                                            <td class="p-2 text-right space-x-2">
                                                <button type="button" onclick="openEditOrderModal(${o.id})" class="text-indigo-600 hover:text-indigo-800 p-1" title="编辑订单"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button type="button" onclick="deleteOrder(${o.id})" class="text-rose-500 hover:text-rose-700 p-1" title="删除订单"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </table>
                        </div>
                    </div>`;
            });
        }

        function initInventoryBatchRows() { addInventoryRow(); }
        function addInventoryRow() {
            const container = document.getElementById('batch-rows-container');
            if(!container) return;
            container.insertAdjacentHTML('beforeend', `
                <div class="grid grid-cols-12 gap-2 items-center inv-batch-row bg-slate-50 p-2 rounded-lg sm:bg-transparent sm:p-0">
                    <input type="date" value="${new Date().toISOString().split('T')[0]}" class="col-span-6 sm:col-span-2 border border-slate-300 p-2 rounded-lg text-xs" required>
                    <input type="text" placeholder="原材料名称" class="col-span-6 sm:col-span-3 border border-slate-300 p-2 rounded-lg text-xs" required>
                    <input type="text" placeholder="供应商名称" class="col-span-6 sm:col-span-2 border border-slate-300 p-2 rounded-lg text-xs">
                    <select class="col-span-6 sm:col-span-1 border border-slate-300 p-2 rounded-lg text-xs"><option value="IN">入库</option><option value="OUT">出库</option></select>
                    <input type="number" placeholder="数量" class="col-span-6 sm:col-span-2 border border-slate-300 p-2 rounded-lg text-xs" required>
                    <input type="text" placeholder="批注" class="col-span-10 sm:col-span-1 border border-slate-300 p-2 rounded-lg text-xs">
                    <button type="button" onclick="this.parentElement.remove()" class="col-span-2 sm:col-span-1 text-rose-500 text-center p-1"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>`);
        }

        async function handleBatchInventorySubmit(e) {
            e.preventDefault();
            const rows = document.querySelectorAll('.inv-batch-row');
            const newItems = [];
            rows.forEach(r => {
                const inputs = r.querySelectorAll('input, select');
                newItems.push({ 
                    date: inputs[0].value, 
                    material: inputs[1].value, 
                    supplier: inputs[2].value || '自主/无',
                    type: inputs[3].value, 
                    quantity: Number(inputs[4].value), 
                    remark: inputs[5].value || '无批注' 
                });
            });
            await supabaseClient.from('inventory').insert(newItems);
            fetchDataFromCloud();
            initInventoryBatchRows();
        }

        function renderInventoryTable() {
            const tbody = document.getElementById('inventory-table-body');
            if(!tbody) return;
            const filteredInv = inventoryData.filter(i => {
                if (!globalSearchKeyword) return true;
                const matchStr = `${i.material || ''} ${i.supplier || ''} ${i.remark || ''} ${i.date || ''}`.toLowerCase();
                return matchStr.includes(globalSearchKeyword);
            });

            tbody.innerHTML = filteredInv.map(i => `
                <tr class="border-b border-slate-100">
                    <td class="p-2.5 sm:p-3">${i.date}</td>
                    <td class="p-2.5 sm:p-3 font-medium">${i.material}</td>
                    <td class="p-2.5 sm:p-3 text-slate-600">${i.supplier || '自主/无'}</td>
                    <td class="p-2.5 sm:p-3"><span class="px-2 py-0.5 rounded text-[11px] font-bold ${i.type === 'IN' ? 'bg-blue-100 text-blue-700' : 'bg-rose-100 text-rose-700'}">${i.type === 'IN' ? '入库' : '出库'}</span></td>
                    <td class="p-2.5 sm:p-3 font-bold">${i.quantity}</td>
                    <td class="p-2.5 sm:p-3 text-slate-500">${i.remark || '无批注'}</td>
                    <td class="p-2.5 sm:p-3 text-right"><button type="button" onclick="deleteInventory(${i.id})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`).join('');

            renderMaterialBalanceCards();
        }

        function renderMaterialBalanceCards() {
            const balanceContainer = document.getElementById('material-balance-cards');
            if(!balanceContainer) return;
            const materialMap = {};

            inventoryData.forEach(item => {
                const mat = item.material || '未知材料';
                if (!materialMap[mat]) {
                    materialMap[mat] = { in: 0, out: 0 };
                }
                const qty = Number(item.quantity || 0);
                if (item.type === 'IN') {
                    materialMap[mat].in += qty;
                } else if (item.type === 'OUT') {
                    materialMap[mat].out += qty;
                }
            });

            const keys = Object.keys(materialMap);
            if (keys.length === 0) {
                balanceContainer.innerHTML = `<div class="col-span-full text-center py-4 text-slate-400 text-xs">暂无原材料出入库记录</div>`;
                return;
            }

            balanceContainer.innerHTML = keys.map(mat => {
                const data = materialMap[mat];
                const balance = data.in - data.out;
                return `
                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-1">
                        <div class="font-bold text-slate-800 text-xs truncate" title="${mat}">${mat}</div>
                        <div class="text-[11px] text-slate-500 flex justify-between"><span>入库: ${data.in}</span><span>出库: ${data.out}</span></div>
                        <div class="text-xs font-bold pt-1 border-t border-slate-200 flex justify-between items-center">
                            <span class="text-slate-400">结余库存:</span>
                            <span class="${balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${balance} 件</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateKPIs() {
            const now = new Date();
            const curYear = now.getFullYear();
            const curMonth = now.getMonth();

            const curOrders = ordersData.filter(o => {
                const d = new Date(o.order_date);
                return d.getFullYear() === curYear && d.getMonth() === curMonth;
            });
            const prevOrders = ordersData.filter(o => {
                const d = new Date(o.order_date);
                return (curMonth === 0) ? (d.getFullYear() === curYear - 1 && d.getMonth() === 11) : (d.getFullYear() === curYear && d.getMonth() === curMonth - 1);
            });

            const curAmt = curOrders.reduce((s, o) => s + Number(o.total_amount || 0), 0);
            const prevAmt = prevOrders.reduce((s, o) => s + Number(o.total_amount || 0), 0);
            const amtTrendPct = prevAmt === 0 ? (curAmt > 0 ? 100 : 0) : (((curAmt - prevAmt) / prevAmt) * 100).toFixed(1);

            const curQtyCount = curOrders.length;
            const prevQtyCount = prevOrders.length;
            const countTrendPct = prevQtyCount === 0 ? (curQtyCount > 0 ? 100 : 0) : (((curQtyCount - prevQtyCount) / prevQtyCount) * 100).toFixed(1);

            document.getElementById('kpi-orders').innerText = `${ordersData.length} 笔`;
            document.getElementById('kpi-orders-trend').innerHTML = `<span>环比：</span><span class="font-bold ${countTrendPct >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${countTrendPct >= 0 ? '+' : ''}${countTrendPct}%</span>`;

            document.getElementById('kpi-amount').innerText = `¥${ordersData.reduce((s, o) => s + Number(o.total_amount || 0), 0).toFixed(2)}`;
            document.getElementById('kpi-amount-trend').innerHTML = `<span>环比：</span><span class="font-bold ${amtTrendPct >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${amtTrendPct >= 0 ? '+' : ''}${amtTrendPct}%</span>`;

            const totalIn = inventoryData.filter(i => i.type === 'IN').reduce((s, i) => s + Number(i.quantity || 0), 0);
            const totalOut = inventoryData.filter(i => i.type === 'OUT').reduce((s, i) => s + Number(i.quantity || 0), 0);
            document.getElementById('kpi-in-stock').innerText = `${totalIn} 件`;
            document.getElementById('kpi-out-stock').innerText = `${totalOut} 件`;
        }

        function renderDeepReport() {
            const container = document.getElementById('customer-cards-container');
            if(!container) return;
            container.innerHTML = '';

            const groups = {};
            ordersData.forEach(o => {
                if (!groups[o.customer]) {
                    groups[o.customer] = { count: 0, totalAmt: 0, totalQty: 0, lastDate: '' };
                }
                groups[o.customer].count += 1;
                groups[o.customer].totalAmt += Number(o.total_amount || 0);
                groups[o.customer].totalQty += Number(o.quantity || 0);
                if (o.order_date && o.order_date > groups[o.customer].lastDate) {
                    groups[o.customer].lastDate = o.order_date;
                }
            });

            const customers = Object.keys(groups);
            if (customers.length === 0) {
                container.innerHTML = `<div class="col-span-3 text-center py-6 text-slate-400 text-xs sm:text-sm">暂无客户分析数据</div>`;
            } else {
                customers.forEach(c => {
                    const info = groups[c];
                    const avgAmt = info.count > 0 ? (info.totalAmt / info.count).toFixed(2) : '0.00';
                    container.innerHTML += `
                        <div class="bg-slate-50 border border-slate-200 p-3.5 sm:p-4 rounded-xl space-y-2.5">
                            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                                <span class="font-bold text-slate-800 text-xs sm:text-sm truncate max-w-[140px]">${c}</span>
                                <span class="text-[10px] sm:text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-medium">成交 ${info.count} 笔</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-600">
                                <div><span class="text-slate-400">数量：</span><span class="font-bold text-slate-700">${info.totalQty} 件</span></div>
                                <div><span class="text-slate-400">均价：</span><span class="font-bold text-slate-700">¥${avgAmt}</span></div>
                                <div class="col-span-2"><span class="text-slate-400">总金额：</span><span class="font-bold text-emerald-600 text-sm">¥${info.totalAmt.toFixed(2)}</span></div>
                                <div class="col-span-2"><span class="text-slate-400">最新时间：</span><span class="text-slate-600">${info.lastDate || '-'}</span></div>
                            </div>
                        </div>
                    `;
                });
            }

            const totalOrders = ordersData.length;
            const totalSum = ordersData.reduce((s, o) => s + Number(o.total_amount || 0), 0);
            const smartText = document.getElementById('smart-report-text');
            if(smartText) {
                smartText.innerHTML = `
                    • 截止目前系统累计服务客户 <strong class="text-indigo-700">${customers.length}</strong> 家，总计完成订单 <strong class="text-indigo-700">${totalOrders}</strong> 笔，总营收额达 <strong class="text-emerald-700">¥${totalSum.toFixed(2)}</strong>。<br>
                    • 采购额最高客户为 <strong class="text-indigo-700">${customers[0] || '无'}</strong>，原材料库存运转保持独立核算。
                `;
            }

            renderCharts(customers, customers.map(c => groups[c].count), customers.map(c => groups[c].totalAmt));
        }

        function renderCharts(labels, qty, amt) {
            if (chartInstance1) chartInstance1.destroy();
            if (chartInstance2) chartInstance2.destroy();

            const ctx1 = document.getElementById('chart-orders-qty');
            if(ctx1) {
                chartInstance1 = new Chart(ctx1.getContext('2d'), {
                    type: 'bar',
                    data: { labels: labels, datasets: [{ label: '订单笔数', data: qty, backgroundColor: '#6366f1' }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            const ctx2 = document.getElementById('chart-orders-amount');
            if(ctx2) {
                chartInstance2 = new Chart(ctx2.getContext('2d'), {
                    type: 'bar',
                    data: { labels: labels, datasets: [{ label: '消费金额(元)', data: amt, backgroundColor: '#10b981' }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        function exportReportToCSV() {
            if (ordersData.length === 0) {
                alert("暂无数据可导出！");
                return;
            }
            let csvContent = "\uFEFF订单号,客户名称,订单笔数,采购总数量,出库数量,剩余未出库数量,累计消费总金额(元),最新交易时间\n";
            const groups = {};
            ordersData.forEach(o => {
                if (!groups[o.customer]) groups[o.customer] = { count: 0, amt: 0, qty: 0, shipped: 0, last: '' };
                groups[o.customer].count += 1;
                groups[o.customer].amt += Number(o.total_amount || 0);
                groups[o.customer].qty += Number(o.quantity || 0);
                groups[o.customer].shipped += Number(o.shipped_quantity || 0);
                if (o.order_date && o.order_date > groups[o.customer].last) groups[o.customer].last = o.order_date;
            });

            Object.keys(groups).forEach(c => {
                const g = groups[c];
                const un = Math.max(0, g.qty - g.shipped);
                csvContent += `"${c}",${g.count},${g.qty},${g.shipped},${un},${g.amt.toFixed(2)},"${g.last}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `承辉包装_月度客户分析报表_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        let currentUploadedImageBase64 = '';
        function openOrderModal() {
            document.getElementById('order-modal-title').innerText = "新建客户订单";
            document.getElementById('ord-edit-id').value = "";
            document.getElementById('order-form').reset();
            document.getElementById('ord-date').valueAsDate = new Date();
            document.getElementById('ord-ship-date').valueAsDate = new Date();
            document.getElementById('ord-no').value = 'CH-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(100 + Math.random() * 900);
            calcOrderDetails();
            document.getElementById('modal-order').classList.remove('hidden');
        }

        function openEditOrderModal(id) {
            const o = ordersData.find(item => item.id === id);
            if (!o) return;
            document.getElementById('order-modal-title').innerText = "编辑客户订单";
            document.getElementById('ord-edit-id').value = o.id;
            document.getElementById('ord-no').value = o.order_no || '';
            document.getElementById('ord-customer').value = o.customer || '';
            document.getElementById('ord-date').value = o.order_date || '';
            document.getElementById('ord-qty').value = o.quantity || 0;
            document.getElementById('ord-price').value = o.price || 0;
            document.getElementById('ord-shipped-qty').value = o.shipped_quantity || 0;
            document.getElementById('ord-ship-date').value = o.ship_date || '';
            document.getElementById('ord-remark').value = o.remark || '';
            calcOrderDetails();
            document.getElementById('modal-order').classList.remove('hidden');
        }

        function closeOrderModal() { document.getElementById('modal-order').classList.add('hidden'); }
        
        function calcOrderDetails() {
            const q = Number(document.getElementById('ord-qty').value || 0);
            const p = Number(document.getElementById('ord-price').value || 0);
            const shipped = Number(document.getElementById('ord-shipped-qty').value || 0);
            
            document.getElementById('ord-total').value = `¥${(q * p).toFixed(2)}`;
            const remaining = Math.max(0, q - shipped);
            document.getElementById('ord-remaining').value = remaining;
        }

        function handleImagePreview(e) {
            const reader = new FileReader();
            reader.onload = (evt) => { currentUploadedImageBase64 = evt.target.result; };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('ord-edit-id').value;
            const q = Number(document.getElementById('ord-qty').value);
            const p = Number(document.getElementById('ord-price').value);
            const shippedQ = Number(document.getElementById('ord-shipped-qty').value || 0);
            const shipDate = document.getElementById('ord-ship-date').value || null;
            const orderNo = document.getElementById('ord-no').value;
            const customer = document.getElementById('ord-customer').value;
            const remark = document.getElementById('ord-remark').value || '无批注';

            const orderPayload = {
                order_no: orderNo,
                customer: customer,
                order_date: document.getElementById('ord-date').value,
                quantity: q,
                price: p,
                total_amount: q * p,
                shipped_quantity: shippedQ,
                ship_date: shipDate,
                remark: remark,
                image: currentUploadedImageBase64 || null
            };

            let res;
            if (editId) {
                res = await supabaseClient.from('orders').update(orderPayload).eq('id', editId);
            } else {
                res = await supabaseClient.from('orders').insert([orderPayload]);
            }

            if (res.error) {
                alert("保存失败，错误信息: " + res.error.message);
                console.error(res.error);
                return;
            }

            fetchDataFromCloud();
            closeOrderModal();
        }

        async function deleteOrder(id) {
            if (confirm('确认删除该笔订单？')) {
                await supabaseClient.from('orders').delete().eq('id', id);
                fetchDataFromCloud();
            }
        }

        async function deleteInventory(id) {
            if (confirm('确认删除该条记录？')) {
                await supabaseClient.from('inventory').delete().eq('id', id);
                fetchDataFromCloud();
            }
        }
    </script>
</body>
